set -g @plugin 'christoomey/vim-tmux-navigator'

# Base pattern from the plugin README, widened for cross-platform use:
#   - `(.+/)?` instead of `(\S+/)?` because macOS `ps -o comm=` prints full
#     executable paths that can contain spaces (`.../Application Support/.../nvim`)
#   - `(\.exe)?` so Cygwin/MSYS2 tmux also matches native Windows binaries
# tmux's pane_current_command returns a bare basename, which this also matches.
set -g @vim_navigator_pattern '(.+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?(\.exe)?'

# Cross-platform detection built from the README's "Faster performance" and
# docker guidance. Everything here is POSIX sh; tmux runs it with `/bin/sh -c`.
#   1. pane_current_command first: tmux supplies this itself, so it needs no
#      `ps` and works on macOS, Linux, WSL and Cygwin/MSYS2, and in slim
#      containers that don't ship procps.
#   2. fast negative for interactive shells.
#   3. `ps` fallback only when present, for wrapped sessions (docker/ssh/...).
#      Linux hosts filter out container cgroups so a vim in another container
#      sharing /dev/pts/<N> can't cause a false positive. Where `ps` is missing
#      or lacks these flags (BSD defaults, BusyBox, MSYS) the probe/greps fail
#      quietly and we simply report "not vim" instead of erroring.
is_vim="\
echo '#{pane_current_command}' | grep -iqE '^@vim_navigator_pattern$' && exit 0; \
echo '#{pane_current_command}' | grep -iqE '^(bash|zsh|fish|sh|dash|ksh|nu|xonsh|tcsh|csh|cmd|powershell|pwsh)$' && exit 1; \
if command -v ps >/dev/null 2>&1; then \
  if [ -f /.dockerenv ]; then \
    ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null \
      | grep -iqE '^[^TXZ ]+ +@vim_navigator_pattern$' && exit 0; \
  elif ps -o state=,comm=,cgroup= -p $$ >/dev/null 2>&1; then \
    ps -o state=,comm=,cgroup= -t '#{pane_tty}' 2>/dev/null \
      | grep -ivE '[0-9]+:[^:]*:.*(docker|containerd|libpod|kubepods)' \
      | grep -iqE '^[^TXZ ]+ +@vim_navigator_pattern( +[0-9]+:.*)?$' && exit 0; \
  else \
    ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null \
      | grep -iqE '^[^TXZ ]+ +@vim_navigator_pattern$' && exit 0; \
  fi; \
fi; \
exit 1"
set -g @vim_navigator_check "${is_vim}"
