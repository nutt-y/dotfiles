onboarding = false

# Mirrors ~/.tmux.conf + ~/.config/tmux/commons.conf and the tuios config.
# tmux "window" = herdr tab, tmux "pane" = herdr pane, tuios "workspace" = herdr tab group.

[theme]
name = "terminal"  # use the terminal's own colours (tuios: theme = "none")

[terminal]
new_cwd = "follow"  # tmux: split-window -c "#{pane_current_path}"

[ui]
tab_bar_position = "top"  # tmux: set -g status-position top
mouse_capture = true      # tmux: set -g mouse on
# tmux unbinds the mouse-drag copy (unbind -T copy-mode-vi MouseDragEnd1Pane)
copy_on_select = false
# tmux new-window creates immediately; no name prompt
prompt_new_tab_name = false
# tuios: border_style = "rounded"; tmux: pane-border-lines "double"
pane_borders = "auto"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[keys]
prefix = "ctrl+space"  # tmux: set -g prefix C-Space; tuios: leader_key

# Splits (tmux: bind | and bind -)
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Windows / tabs (tmux: bind n / bind p / bind c / bind , ; base-index 1)
next_tab = "prefix+n"
previous_tab = "prefix+p"
new_tab = "prefix+c"
rename_tab = "prefix+,"

# Pane focus (tmux: bind h/j/k/l select-pane)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Resize (tmux: bind -r <arrow> resize-pane -<dir> 5)
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"

# Zoom (tmux: bind -r m resize-pane -Z; tuios toggle_zoom)
zoom = "prefix+m"

# Close / detach / reload (tmux: bind-x default, detach prefix+d, bind r source-file)
close_pane = "prefix+x"
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Sidebar and agents (tuios: prefix_toggle_sidebar e)
toggle_sidebar = "prefix+e"
next_agent = "prefix+a"
previous_agent = "prefix+s"

# Tree / goto (tuios: choose_tree "/", prefix_window g)
workspace_picker = "prefix+/"
goto = "prefix+g"

edit_scrollback = "prefix+shift+="

# Floating scratch terminal on t (tuios: toggle_scratch t)
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
width = "80%"
height = "80%"
description = "scratch terminal"

[server]
headless_cols = 120
headless_rows = 40

[session]
resume_agents_on_restore = true  # tuios: startup daemon = true; agents resume after restart

[update]
channel = "stable"
