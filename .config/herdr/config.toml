onboarding = false
[keys]
prefix = "ctrl+space"

# Splits (tmux used | and -)
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Tab Cycling
next_tab = "prefix+n"
previous_tab = "prefix+p"

# Close tab
# close_tab = ""
# [[keys.command]]
# key = "prefix+x"
# type = "popup"
# command = "bash -c 'read -p \"Close tab? (y/n) \" confirm; if [ \"$confirm\" = \"y\" ]; then herdr tab close; fi'"
# description = "close tab with confirmation"
# width = "30%"

# Zoom (tmux used m)
zoom = "prefix+m"

# Detach from the session
detach = "prefix+d"

# Reload config
reload_config = "prefix+r"

# Resize mode (tmux had direct arrows, herdr uses a mode)
resize_mode = "prefix+shift+r"

# Pane close
close_pane = "prefix+x"

# Close sidetab
toggle_sidebar = "prefix+e"

# Edit scrollback
edit_scrollback = "prefix+shift+="

# focus agent sidebar
next_agent = "prefix+a"
previous_agent = "prefix+s"

# Create new tab
new_tab = "prefix+c"

[theme]
name = "terminal"

# UI


# Vim Navigation
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"
