# Linux (Local)
#   export USER_NAME=dev PASSWORD=1111
#   sudo -E ansible-playbook -i inventory.yaml setup.yaml --limit localhost
# macOS (local, user must already exist):
#   export USER_NAME=$(whoami)
#   ansible-playbook -i inventory.yaml setup.yaml --limit localhost
# Remote host (any Linux, by IP):
#   export USER_NAME=dev PASSWORD=1111 TARGET_IP_ADDRESS=0.0.0.0
#   sudo -E ansible-playbook -i inventory.yaml setup.yaml --limit remote_host
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_host: 127.0.0.1
    remote_host:
      ansible_host: "{{ lookup('env', 'TARGET_IP_ADDRESS') }}"
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
